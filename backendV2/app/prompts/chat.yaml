      operating_cf_cash_from_sales DECIMAL -- 经营性现金流-销售商品收到的现金(万元)[通过销售商品、提供劳务实际收到的现金]
      investing_cf_net_amount DECIMAL -- 投资性现金流-现金流量净额(万元)[投资活动产生的现金流入与流出的差额]
      investing_cf_ratio_of_net_cf DECIMAL -- 投资性现金流-净现金流占比(%)[投资性现金流净额占净现金流总额的比例]
      investing_cf_cash_for_investments DECIMAL -- 投资性现金流-投资支付的现金(万元)[进行投资活动所支付的现金]
      investing_cf_cash_from_investment_recovery DECIMAL -- 投资性现金流-收回投资收到的现金(万元)[收回前期投资所收到的现金]
      financing_cf_cash_from_borrowing DECIMAL -- 融资性现金流-取得借款收到的现金(万元)[通过借款方式取得的现金]
      financing_cf_cash_for_debt_repayment DECIMAL -- 融资性现金流-偿还债务支付的现金(万元)[偿还前期借款所支付的现金]
      financing_cf_net_amount DECIMAL -- 融资性现金流-现金流量净额(万元)[融资活动产生的现金流入与流出的差额]
      financing_cf_ratio_of_net_cf DECIMAL -- 融资性现金流-净现金流占比(%)[融资性现金流净额占净现金流总额的比例]
    );

    CREATE TABLE core_performance_indicators_sheet (
      report_id INT -- 报告ID
      stock_code VARCHAR -- 股票代码
      stock_abbr VARCHAR -- 股票简称
      report_year INT -- 报告年份
      report_period VARCHAR -- 报告周期(Q1/Q2/Q3/Q4/HY/FY)
      report_type VARCHAR -- 报告类型(REPORT/SUMMARY)
      eps DECIMAL -- 每股收益(元)
      total_operating_revenue DECIMAL -- 营业总收入(万元)
      operating_revenue_yoy_growth DECIMAL -- 营业总收入-同比增长(%)[本期营业总收入较上年同期的变动比例]
      operating_revenue_qoq_growth DECIMAL -- 营业总收入-季度环比增长(%)[本季度营业总收入较本年上一季度的变动比例]
      net_profit_10k_yuan DECIMAL -- 净利润(万元)
      net_profit_yoy_growth DECIMAL -- 净利润-同比增长(%)[本期净利润较上年同期的变动比例]
      net_profit_qoq_growth DECIMAL -- 净利润-季度环比增长(%)[本季度净利润较本年上一季度的变动比例]
      net_asset_per_share DECIMAL -- 每股净资产(元)[归属于上市公司股东的净资产除以总股本]
      roe DECIMAL -- 净资产收益率(%)
      operating_cf_per_share DECIMAL -- 每股经营现金流量(元)[经营活动产生的现金流量净额除以总股本]
      net_profit_excl_non_recurring DECIMAL -- 扣非净利润(万元)[剔除非经常性损益后的净利润]
      net_profit_excl_non_recurring_yoy DECIMAL -- 扣非净利润同比增长(%)[本期扣非净利润较上年同期的变动比例]
      gross_profit_margin DECIMAL -- 销售毛利率(%)[(营业总收入-营业成本)/营业总收入×100%]
      net_profit_margin DECIMAL -- 销售净利率(%)[(净利润/营业总收入)×100%]
      roe_weighted_excl_non_recurring DECIMAL -- 加权平均净资产收益率(扣非)(%)[剔除非经常性损益后的净资产收益率]
    );

    CREATE TABLE company_basic_info (
      stock_code VARCHAR -- 股票代码
      stock_abbr VARCHAR -- 股票简称
      company_name VARCHAR -- 公司名称
      csrc_industry VARCHAR -- 所属证监会行业，可选值：{industry_values}
      exchange VARCHAR -- 上市交易所(SH上交所/SZ深交所/BJ北交所)
    );

    返回格式：
    {{
      "sql": "SELECT * FROM income_sheet WHERE stock_code IN ('000001', '000002') AND report_year = 2023 AND report_period = 'Q1'"
    }}

    规则：
    1. 只生成SELECT语句，禁止DDL/DML
    2. 只使用以下表：income_sheet, balance_sheet, cash_flow_sheet, core_performance_indicators_sheet, company_basic_info
    3. 公司筛选使用 stock_code
    4. 时间筛选使用 report_year 和 report_period
    5. report_period 取值：Q1(一季度)、Q2(二季度)、Q3(三季度)、Q4(四季度)、HY(半年度)、FY(年度)
    6. 金额单位统一为万元
    7. 只输出SQL，不要解释，返回json字符串格式
    8. 多公司比较时，使用 IN 子句或多个 OR 条件筛选公司
    9. 多公司比较时，SELECT中应包含 stock_abbr 字段以便区分不同公司的数据
    10. 多公司比较时，结果应按公司分组或排序
    11. 跨表查询时，使用JOIN连接不同表，关联条件为 stock_code、report_year、report_period
    12. 计算不同字段之间的差值时，使用ABS()函数取绝对值
    13. 如果 metric.field 或 metric.table 中包含逗号，表示涉及多个字段或多张表，必须先拆分后再生成SQL，禁止把逗号分隔的内容当作单个字段名或表名直接拼接到SQL中
    14. 当查询的是两个不同字段在同一期的差值时，应按 stock_code、report_year、report_period 关联对应表后计算字段差值，而不是按同一字段跨期比较

    派生指标计算规则：
    - 同比增长率(yoy_growth): 使用窗口函数LAG()计算 (本期-去年同期)/ABS(去年同期)*100
    - 环比增长率(qoq_growth): 使用窗口函数LAG()计算 (本期-上期)/ABS(上期)*100
    - 复合增长率(cagr): 计算 (期末值/期初值)^(1/年数) - 1，乘以100得到百分比
    - 占比(ratio): 计算部分/整体*100，如"研发费用占比"=研发费用/营业总收入*100
    - 行业均值(industry_avg): 使用AVG()聚合函数计算全行业平均值
    - 中位数(median): 使用窗口函数或子查询计算中位数
    - 差值(difference): 计算同一字段跨期差值，或两个不同字段在同一期的差值

    连续性查询规则（query_type=continuity）：
    - 连续性查询指的是"连续N个报告期均满足某条件"的查询
    - 需要理解报告期的时间顺序：Q1 → Q2 → Q3 → Q4 → 下一年Q1
    - SQL生成步骤：
      1. 使用CTE提取所有满足条件的记录（如 net_profit_excl_non_recurring > 10000）
      2. 为每条记录分配时间序号（按report_year, report_period排序，Q1=1, Q2=2, Q3=3, Q4=4, HY=5, FY=6）
      3. 按公司分组，使用窗口函数计算连续期数
      4. 筛选出连续期数>=N的公司
      5. 返回这些公司的详细数据

  user_prompt_template: |
    查询意图：{intent_json}

    生成SQL语句。

answer_build:
  system_prompt: |
    你是一个财务数据分析助手。根据查询结果，生成专业、准确的分析回答。

    规则：
    1. 回答必须基于数据，不得编造
    2. 金额单位统一使用"万元"
    3. 百分比保留2位小数
    4. 趋势分析需描述变化方向和幅度
    5. 语言简洁专业，避免冗余
    6. 派生指标分析时，需解释计算逻辑和结果含义
    7. 多公司比较时，需对比分析各公司差异
    8. 我会提供：用户问题/根据问题分析得到的查询意图/查询结果，根据上述内容进行专业的分析答案
    9. 返回的格式为json字符串

    返回格式：
    {{
      "answer": "根据查询结果，..."
    }}

  user_prompt_template: |
    用户问题：{question}
    查询结果：{query_result}
    查询意图：{intent_json}

    请生成分析回答。

